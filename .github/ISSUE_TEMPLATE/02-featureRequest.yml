name: 功能建议
description: 为 HarmonyOS 版本提出可验证的功能建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复建议
          required: true
        - label: 该建议适用于 HarmonyOS 版本的使用场景
          required: true
  - type: dropdown
    id: area
    attributes:
      label: 相关区域
      options: [阅读器, 书源, 书架, 订阅/RSS, 漫画, 音频, 数据/同步, 构建/安装, 其他]
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁会在什么情况下使用这个功能？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议内容
      description: 请尽量描述可观察的交互和结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方案
  - type: input
    id: version
    attributes:
      label: 当前应用版本
  - type: textarea
    id: demo
    attributes:
      label: 草图或参考资料
